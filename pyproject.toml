[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-windowing-engine"
version = "0.1.0"
description = "Event-time stream processing: tumbling, sliding and session windows with watermarks, late-data handling and checkpointed state"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["streamwin"]
